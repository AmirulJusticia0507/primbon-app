{{ define "base" }}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition layout-top-nav">
<div class="wrapper">
  <nav class="navbar navbar-expand navbar-light bg-white border-bottom" aria-label="Navigasi utama">
    <a class="navbar-brand" href="/">Primbon App</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Beranda</a>
      <a class="nav-link" href="/hari-baik">Hari Baik</a>
    </div>
  </nav>
  <div class="content-wrapper">
    <section class="content p-4">
      {{ block "content" . }}{{ end }}
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
{{ end }}
